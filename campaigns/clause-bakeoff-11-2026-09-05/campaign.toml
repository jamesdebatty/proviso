# Clause bakeoff 11, live declaration in clause-campaign/1 (adapter claude-code/2).
#
# Written 2026-09-05 by the council chair. Hashes bind protocol.md, the four
# CLAUDE.md variants, the six probe trees (seed, hidden oracle, reference,
# must-cover), the four rubrics, the pinned Claude Code binary copy, and the
# pinned python interpreter. `check` validates it; `exercise` dispatches nothing
# without a clause-run-authorization/1 file naming the plan hash.

schema = "clause-campaign/1"

[campaign]
id = "clause-bakeoff-11-2026-09-05"
protocol = "protocol.md"
protocol_sha256 = "8748ef91761702c87d54a9bfb43c1c044d9a05bbd3fe1c83a5e0d55832cbdf36"
repetitions = 5                    # protocol.md "Design": 4 arms x 6 probes x 5 (amendment 2026-09-05b)

[execution]                        # protocol.md "Environment freeze"
adapter = "claude-code/2"
network = true
model = "claude-opus-5"
effort = "high"
binary = "~/.claude-eval-pins/bakeoff10/claude"
binary_version = "2.1.258 (Claude Code)"
binary_sha256 = "b63136194160791c27cfa7b0403060d85eb0752991625fde8c09f9acacb17c78"
timeout_seconds = 1200
workers = 3
tools = ["Bash", "Read", "Edit", "Write", "Grep", "Glob"]
permission_mode = "acceptEdits"
allowed_tools = ["Bash(python3 *)"]
max_budget_usd = 3.0
python_interpreter = "/opt/homebrew/Cellar/python@3.14/3.14.5/Frameworks/Python.framework/Versions/3.14/bin/python3.14"
python_version = "3.14.5"

[[variants]]
id = "a1-response-numbers"
claude_md = "variants/a1-response-numbers.md"
sha256 = "f70f86a92e9fa1b1a2161adb5c64e00cd069e16075086dd9ccf61d7b75b5b2cf"   # anchor: bakeoff 8 composite / bakeoff 9-10 A1 bytes

[[variants]]
id = "dc1-deployed-final-message"
claude_md = "variants/dc1-deployed-final-message.md"
sha256 = "2e451cadb24795c75c643c34d169276794c60e212f1a0f6d60b3ec46182ad496"   # DEP + "## Final message" + council clause

[[variants]]
id = "dep-deployed-file"
claude_md = "variants/dep-deployed-file.md"
sha256 = "4b670ca87fe7c7428e6ab293b96e7c64771f210a171ddae774716598e351e84c"   # baseline: byte copy of ~/.claude/CLAUDE.md, 2026-09-05

[[variants]]
id = "dv1-deployed-vendor"
claude_md = "variants/dv1-deployed-vendor.md"
sha256 = "c6da4910c9b2f4a6ffe800d1bef545ff17be6a62ed6cd7bd4662619a8909b2c9"   # DEP + "## Working on a task" + vendor clause

[[probes]]
id = "config-bounds"
path = "probes/config-bounds"
tree_sha256 = "d2c993bc8b2b4324649b427a596ed235c2ff932df72813b844c65542ee53c403"

[[probes]]
id = "month-end-recurrence"
