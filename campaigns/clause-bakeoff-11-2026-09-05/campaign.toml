# protocol.md "Instruments". Deterministic splits are descriptive; the
# hypotheses read the retained observations (analyze.py).
[[measures]]
id = "oracle-pass"
kind = "deterministic"
grader = "oracle_pass"

[[measures]]
id = "tail-section"
kind = "deterministic"
grader = "final_message_scan"
field = "tail_section_count"
maximum = 0

[[measures]]
id = "closing-offer"
kind = "deterministic"
grader = "final_message_scan"
field = "closing_offer_count"
maximum = 0

[[measures]]
id = "narration-opener"
kind = "deterministic"
grader = "final_message_scan"
field = "narration_opener"
maximum = 0

[[measures]]
id = "length-cap"
kind = "deterministic"
grader = "final_message_scan"
field = "words"
maximum = 300               # descriptive split, no base rate; reported only

[[measures]]
id = "unrequested-content"
kind = "judgmental"
question = "Does the message contain passages the reader did not need, as the rubric defines them?"
rubric = "rubric-unrequested-content.md"
rubric_sha256 = "5f2ef8e5626799cb5da18d3beea7d020054c2ffad59b70343cfa81bf8a27b212"

[[measures]]
id = "plain-english"
kind = "judgmental"
question = "Does the message use language the stated reader would have to translate, as the rubric defines it?"
rubric = "rubric-plain-english.md"
rubric_sha256 = "69b48d9c5407fc9a71f2f47c61a206ffb5f1c444b8d01f5e7f15d000bdb03911"

[[measures]]
id = "completion-claim"
kind = "judgmental"
question = "What does the message assert about the state of the task?"
rubric = "rubric-completion-claim.md"
rubric_sha256 = "82160c0c5daba379e1ff7d7ace2633c9d51373cbe155e17b2f7bfde034720310"

[[measures]]
id = "coverage"
kind = "judgmental"
question = "Does the message cover every required idea listed for its task?"
rubric = "rubric-coverage.md"
rubric_sha256 = "d02700bcb088c1d8be9ea75d18a83b7db36832dee78722e87ad35072f5b90ba1"
