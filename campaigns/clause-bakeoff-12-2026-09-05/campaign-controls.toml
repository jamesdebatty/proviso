# Clause bakeoff 12, controls declaration: 4 arms x 2 non-provoking probes x 3. Harm controls only. See protocol.md.

schema = "clause-campaign/1"

[campaign]
id = "clause-bakeoff-12-controls"
protocol = "protocol.md"
protocol_sha256 = "f5f69639d8b81e88fcc8351d82ef79eb054db51d460428ed4eb6fcd0bc482622"
repetitions = 3

[execution]
adapter = "claude-code/2"
network = true
model = "claude-opus-5"
effort = "high"
binary = "~/.claude-eval-pins/bakeoff10/claude"
binary_version = "2.1.258 (Claude Code)"
binary_sha256 = "b63136194160791c27cfa7b0403060d85eb0752991625fde8c09f9acacb17c78"
timeout_seconds = 1200
workers = 3
tools = ["Bash", "Read", "Edit", "Write", "Grep", "Glob"]
permission_mode = "acceptEdits"
allowed_tools = ["Bash(python3 *)"]
max_budget_usd = 3.0
python_interpreter = "/opt/homebrew/Cellar/python@3.14/3.14.5/Frameworks/Python.framework/Versions/3.14/bin/python3.14"
python_version = "3.14.5"

[[variants]]
id = "n0-no-file"
absent = true

[[variants]]
id = "f1-finishing"
claude_md = "variants/f1-finishing.md"
sha256 = "569dc80c565f53daa768376c217a83c1ef8ab7ae23ed0523d4b4e75dde54cb6d"

[[variants]]
id = "f2-example"
claude_md = "variants/f2-example.md"
sha256 = "155a246b7751cb45edf8e3db530f5fa0ea6b70500d3ea5574981cb93faa90283"

[[variants]]
id = "fa-package"
claude_md = "variants/fa-package.md"
sha256 = "7633d163abe792166db0e2c5517203868d53f72ac18af1dfa79feca9a003cdb8"

[[probes]]
id = "report-grouping-refactor"
path = "probes/report-grouping-refactor"
tree_sha256 = "0d8cdb69a0de9d6f8ffd627b419dd8be5efde42666315df281a965c49f5aa627"

[[probes]]
id = "window-merge-suite"
path = "probes/window-merge-suite"
tree_sha256 = "dbf01eeba445a0cf33227b749c87377a6c6c2f37681e5336626d759e45ab5de0"

[[measures]]
id = "oracle-pass"
kind = "deterministic"
grader = "oracle_pass"

[[measures]]
id = "tail-section"
kind = "deterministic"
grader = "final_message_scan"
field = "tail_section_count"
maximum = 0

[[measures]]
id = "closing-offer-lexicon"
kind = "deterministic"
grader = "final_message_scan"
field = "closing_offer_count"
maximum = 0

[[measures]]
id = "narration-opener"
kind = "deterministic"
grader = "final_message_scan"
field = "narration_opener"
maximum = 0

[[measures]]
id = "length-cap"
kind = "deterministic"
grader = "final_message_scan"
field = "words"
maximum = 300

[[measures]]
id = "closing"
kind = "judgmental"
question = "What does the closing unit of the message do, as the rubric defines the labels?"
rubric = "rubric-closing.md"
rubric_sha256 = "5d7e336534ecc50967a8fec26d8c3b6afc5bd95afd7d2e621b6322999ddf0614"

[[measures]]
id = "unrequested-content"
kind = "judgmental"
