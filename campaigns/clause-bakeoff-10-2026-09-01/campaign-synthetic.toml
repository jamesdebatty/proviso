# protocol.md "Instruments": maxima are descriptive splits at A1's bakeoff 8
# base-rate medians; the primary contrast reads the retained observations.
[[measures]]
id = "sentence-length"
kind = "deterministic"
grader = "max_mean_sentence_words"
maximum = 18

[[measures]]
id = "paragraph-length"
kind = "deterministic"
grader = "max_mean_paragraph_words"
maximum = 42

[[measures]]
id = "length-cap"
kind = "deterministic"
grader = "max_words"
maximum = 1093               # 110% of A1 base-rate median 994

[[measures]]
id = "mannered-prose"
kind = "judgmental"
question = "Does the response contain mannered prose, as the rubric defines it?"
rubric = "rubric-mannered-prose.md"
rubric_sha256 = "2d0e565e06c14b03aab39df5a90c01fd57d86269f7a41a7a54b0c54be58734fe"

[[measures]]
id = "coverage"
kind = "judgmental"
question = "Does the response cover every required idea listed for its question?"
