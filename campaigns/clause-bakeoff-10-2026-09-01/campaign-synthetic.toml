# Clause bakeoff 10, offline lifecycle proof (clause-campaign/1, synthetic/1).
# The live declaration is campaign.toml; this one exercises the same inputs
# against the placeholders and proves nothing about a model.
#
# Written 2026-09-01. Every value below is checkable against protocol.md; the
# hashes bind the protocol, the three CLAUDE.md variants, the five probe trees
# (prompt, seed, synthetic placeholders, must-cover list) and the two rubrics.
# `python3 scripts/clause_campaign.py check <this file>` validates it.
#
# THE CAMPAIGN HAS NOT RUN. The only adapter clause-campaign/1 exposes is the
# offline synthetic one, and the placeholders under probes/*/synthetic/ are not
# model output. A live run needs T-023 and James's per-run authorization.

schema = "clause-campaign/1"

[campaign]
id = "clause-bakeoff-10-2026-09-01"
protocol = "protocol.md"
protocol_sha256 = "3a203dd274d94c7dee922711694f950295b02373138f9ba659fd956a0e5cb1d3"
repetitions = 5                    # protocol.md "Design": 3 arms x 5 probes x 5

[execution]
adapter = "synthetic/1"            # offline placeholder lifecycle only; see protocol.md
network = false                    # "What cannot run today"
model = "synthetic-fixture/1"      # the intended live generator is claude-opus-5,
                                   # effort high, no tools (protocol.md "Environment
                                   # freeze"); this format cannot yet declare it

[[variants]]
id = "a1-response-numbers"
claude_md = "variants/a1-response-numbers.md"
sha256 = "f70f86a92e9fa1b1a2161adb5c64e00cd069e16075086dd9ccf61d7b75b5b2cf"   # Response style + Numbers; bakeoff 8 composite bytes

[[variants]]
id = "d1-density-long"
claude_md = "variants/d1-density-long.md"
sha256 = "9999bb6ce4ba913a65a04aca9d76f53c43c0ea524c07aa26229443fde4bdf371"   # A1 + full writing-density instruction

[[variants]]
id = "d2-density-short"
claude_md = "variants/d2-density-short.md"
sha256 = "22e6ed46682dfa2b4af2e2f008bd98ee274599dc5977b66b90df35c935c79eb7"   # A1 + "Please remove all mannered prose."

[[probes]]
id = "entitlement-drift-mechanism"
path = "probes/entitlement-drift-mechanism"
